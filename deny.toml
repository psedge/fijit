[graph]
targets = []

[licenses]
# MPL-2.0 (OSI-approved weak copyleft; file-level, fine for binary
# distribution) covers cssparser/cssparser-macros/dtoa-short/selectors,
# pulled in transitively by the `scraper` crate.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "OpenSSL", "CDLA-Permissive-2.0", "MPL-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[advisories]
ignore = [
    # fxhash, pulled in by scraper -> selectors, is unmaintained with no safe
    # upgrade available (it's a hasher, not network/parsing code) -- accepted.
    "RUSTSEC-2025-0057",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
