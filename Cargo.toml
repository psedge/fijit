[workspace]
members = [
    "crates/fijit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/psedge/fijit"
homepage = "https://github.com/psedge/fijit"
authors = ["Peter Sedgewick"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.25"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"

[profile.release]
opt-level = 3
strip = true
